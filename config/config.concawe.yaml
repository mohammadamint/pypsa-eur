        GR: 0.01
        HR: 0.07
        HU: 0.08
        IE: 0.0
        IT: 0.03
        LT: 0.4
        LU: 0.1
        LV: 0.33
        ME: 0.0
        MK: 0.25
        NL: 0.04
        "NO" : 0.04
        PL: 0.2
        PT: 0.001
        RO: 0.11
        RS: 0.26
        SE: 0.42
        SI: 0.1
        SK: 0.15
        XK: 0.03

# adding custom constraints
solving:
  constraints:
  
    oil_supply_constraint:
        enable: true
        path: "data/additional_data/liquid_supply.csv"
        
    import_tax:
        enable: false
        electricity: 
            tax_value: 20 #eur/mwh
            max_import_share: 0.3 #percent of electricity demand as maximum constraint for import
        hydrogen: 
            tax_value: 20 #eur/mwh
            max_import_share: 1 #percent of hydrogen demand as maximum constraint for import
      
    firm_capacity:
        enable: true
        max_demand_hour_share: 1 # percentage of max hour demand to be met by firm carriers
        capacity_shares: # the list of firm carriers, and share of their capacity to contribute to max hour demand
            "OCGT": 0.9
            "CCGT": 0.9
            # "OCGT methanol": 0.9
            "nuclear": 0.9
            "H2 turbine": 0.9
            "H2 Fuel Cell": 0.9
            # "hydro": 0.9
            # "PHS": 0.5
            # "battery": 0.5
            # "home battery": 0.5
            
    overwrite_technical_potentials: true
    
  # solver_options:
