    limit_sense: <=
    price:
      NH3: 97
      # methanol: 121
      oil: 125
      
  methanol:
    methanol_reforming: false
    methanol_reforming_cc: false
    
# adding custom constraints
solving:
  # solver:
  #   name: gurobi
  #   options: gurobi-numeric-focus
    
  options:
    curtailment_mode: false
  constraints:
  
    min_cap_constraint:
        enable: true
        path: "data/additional_data/min_cap_2050_DE.csv"
        ratio: 0.75
        countries: "all"
            # - AT
            # - BE
            # - BG
            # - CH
            # - CZ
            # - DE
            # - DK
            # - EE
            # - ES
            # - FI
            # - FR
            # - GB
            # - GR
            # - HR
            # - HU
            # - IE
            # - IT
            # - LT
            # - LU
            # - LV
            # - NL
            # - "NO"
            # - PL
            # - PT
            # - RO
            # - SE
            # - SI
            # - SK
        nuclear: true
  
    oil_supply_constraint:
        enable: true
        path: "data/additional_data/liquid_supply.csv"

    import_tax:
        enable: true
        electricity: 
            tax_value: 20 #eur/mwh
            max_import_share: 0.3 #if import is more than the max_import_share * demand will be taxed
        hydrogen: 
            tax_value: 20 #eur/mwh
            max_import_share: 0.75 #if import is more than the max_import_share * demand will be taxed
      
    firm_capacity:
        enable: true
        max_demand_hour_share: 1 # percentage of max hour demand to be met by firm carriers
        capacity_shares: # the list of firm carriers, and share of their capacity to contribute to max hour demand
            "OCGT": 0.9
            "CCGT": 0.9
            # "OCGT methanol": 0.9
            "nuclear": 0.9
            "H2 turbine": 0.9
            "H2 Fuel Cell": 0.9
            "hydro": 0.9
            "PHS": 0.5
            "battery": 0.5
            "home battery": 0.5
            
    overwrite_technical_potentials: true
    import_constraints:
        sense: ">="
        carriers: 
            NH3: 893520000 # 612 TWh * 1.46 (efficiency of ammonia cracker)
            oil: 152000000
clustering:
  temporal:
    resolution_sector: 3h
    
