electricity: # consider nuclear capacitiy expansion everwhere and limit it in the custom constraints
  extendable_carriers:
    Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT,nuclear]
  everywhere_powerplants: [nuclear]
  
  
sector:

  land_transport_fuel_cell_share:
    2050: 0.1874
    
  land_transport_electric_share:
    2050: 0.7898
    
  land_transport_ice_share:
    2050: 0.0228
    
  shipping_methanol_share:
    2050: 0
    
  shipping_oil_share:
    2050: 1
    
  regional_co2_sequestration_potential:
    enable: true
    attribute:
    - conservative estimate Mt

  biomass_spatial: true #if biomass is spatial, the synfuel production may happen in place in all the countries
  biomass_transport: true # in this case it can move wiht a cost
  biomass_to_liquid: false
  biomass_to_liquid_cc: true
  electrobiofuels: false

  H2_network: true
  H2_retrofit: false
  methanol:
    methanol_to_power:
      ccgt: false
      ccgt_cc: false
      ocgt: false
      allam: false
      
  # this is also fueling a bit the crazy growth of district heating. Let's assume they cant contribute to district heating at this stage
  use_fischer_tropsch_waste_heat: false
  use_haber_bosch_waste_heat: false
  use_methanolisation_waste_heat: false
  use_methanation_waste_heat: false
  use_fuel_cell_waste_heat: false
  use_electrolysis_waste_heat: false
